name: Echo-Chroniken Complete Species & Boss Balance Matrix

on:
  pull_request:
    paths:
      - 'echo-chroniken/project/data/species.js'
      - 'echo-chroniken/project/src/game.js'
      - 'echo-chroniken/project/tests/all-species-matrix.cjs'
      - 'echo-chroniken/project/tests/boss-adaptive-balance.cjs'
      - '.github/workflows/echo-balance-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  all-species-matchups:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every ordered species match-up, 3 levels and 2 RNG seeds
        run: node echo-chroniken/project/tests/all-species-matrix.cjs
      - name: Run the entire match-up matrix again on different levels and seeds
        run: node echo-chroniken/project/tests/all-species-matrix.cjs --audit-again
      - name: Verify late-boss balance against weaker tactics and no potions
        run: node echo-chroniken/project/tests/boss-adaptive-balance.cjs
      - name: Preserve all match-up diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-combat-balance-matrix
          path: |
            echo-chroniken/docs/visual-audit/battle-matrix/all-species-matrix-report.json
            echo-chroniken/docs/visual-audit/battle-matrix/repeat-matrix-report.json
            echo-chroniken/docs/visual-audit/stress-testing/human-battle-report.json
          retention-days: 7
          if-no-files-found: warn
