name: Echo-Chroniken Combat Status Mechanics

on:
  pull_request:
    paths:
      - 'echo-chroniken/project/data/skills.js'
      - 'echo-chroniken/project/src/game.js'
      - 'echo-chroniken/project/tests/combat-status.cjs'
      - 'echo-chroniken/project/qa/combat-status-browser.py'
      - '.github/workflows/echo-combat-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Status duration, damage, shields, regen and battle isolation
        run: node echo-chroniken/project/tests/combat-status.cjs
      - name: Browser screenshots and real attack selection, desktop and touch
        run: python echo-chroniken/project/qa/combat-status-browser.py
      - name: Upload status UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-combat-status-evidence
          path: echo-chroniken/docs/visual-audit/combat-status/
          retention-days: 7
          if-no-files-found: warn
