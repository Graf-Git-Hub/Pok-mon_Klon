name: Echo-Chroniken Android APK (Handy + TV)

on:
  push:
    branches: [main]
    paths:
      - 'echo-chroniken/project/**'
      - 'echo-chroniken/android/**'
      - '.github/workflows/echo-android-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: echo-chroniken-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check shared battle engine
        working-directory: echo-chroniken/project
        run: |
          node tests/smoke.cjs
          node tests/house.cjs
      - name: Check app controls and assets
        working-directory: echo-chroniken/android
        run: |
          node tests/check-platform.cjs
          python3 build_assets.py
          node --check app/src/main/assets/src/game.js
          node --check app/src/main/assets/platform.js
      - name: Build installable Android APK
        working-directory: echo-chroniken/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare direct APK download (no ZIP)
        run: |
          cp echo-chroniken/android/app/build/outputs/apk/debug/app-debug.apk Echo-Chroniken-Universal.apk
          test -s Echo-Chroniken-Universal.apk
          unzip -t Echo-Chroniken-Universal.apk | tail -n 1
          sha256sum Echo-Chroniken-Universal.apk
      - name: Publish APK directly to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Echo-Chroniken - aktuelle Android-APK
          body: |
            **Direkt installierbare APK für Android-Handy und Android-TV.**
            
            Lade unten `Echo-Chroniken-Universal.apk` herunter.
            **Kein ZIP und kein Entpacken nötig.**
            
            Dies ist eine Testversion. Die Switch-Controller-Bedienung muss auf dem echten TV geprüft werden.
            Bei einer neuen Testversion kann wegen der bisher nicht dauerhaft verwalteten Debug-Signatur eine Neuinstallation nötig sein.
            
            Build aus Commit: ${{ github.sha }}
          files: Echo-Chroniken-Universal.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
