name: Echo-Chroniken Android (Handy + TV)
on:
  push:
    paths:
      - 'echo-chroniken/project/**'
      - 'echo-chroniken/android/**'
      - '.github/workflows/echo-android-universal.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check shared battle engine
        working-directory: echo-chroniken/project
        run: node tests/smoke.cjs
      - name: Check app controls and assets
        working-directory: echo-chroniken/android
        run: |
          node tests/check-platform.cjs
          python3 build_assets.py
          node --check app/src/main/assets/src/game.js
          node --check app/src/main/assets/platform.js
      - name: Build actual APK
        working-directory: echo-chroniken/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp echo-chroniken/android/app/build/outputs/apk/debug/app-debug.apk Echo-Chroniken-Universal-v0.7-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Chroniken-Universal-APK
          path: Echo-Chroniken-Universal-v0.7-debug.apk
          retention-days: 30
