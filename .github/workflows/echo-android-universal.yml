name: Echo-Chroniken - one stable Android APK (Handy + TV)

on:
  push:
    branches: [main]
    paths:
      - 'echo-chroniken/project/**'
      - 'echo-chroniken/android/**'
      - '.github/workflows/echo-android-universal.yml'
  pull_request:
    paths:
      - 'echo-chroniken/project/**'
      - 'echo-chroniken/android/**'
      - '.github/workflows/echo-android-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: echo-chroniken-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require private permanent signing secrets for APK release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ECHO_SIGNING_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ECHO_SIGNING_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ]; then
            echo "::error title=Permanent APK signing required::Configure ECHO_KEYSTORE_B64, ECHO_SIGNING_PASSWORD and ECHO_SIGNING_ALIAS as GitHub Actions secrets before publishing. Never rotate the key or package ID for an update."
            exit 1
          fi
      - name: Install Android API 35 SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test shared game engine and starter balance
        working-directory: echo-chroniken/project
        run: |
          node tests/map-registry.cjs
          node tests/chapter3.cjs
          node tests/save-compat.cjs
          node tests/story-registry.cjs
          node tests/smoke.cjs
          node tests/house.cjs
          node tests/village.cjs
          node tests/package.cjs
          node tests/encounters.cjs
          node tests/encounter-registry.cjs
          node tests/first-route.cjs
      - name: Check Android controls and bundle offline assets
        working-directory: echo-chroniken/android
        run: |
          node tests/check-platform.cjs
          python3 build_assets.py
          node --check app/src/main/assets/src/quests/registry.js
          node --check app/src/main/assets/src/maps/registry.js
          node --check app/src/main/assets/src/maps/chapter3.js
          node --check app/src/main/assets/src/encounters/registry.js
          node --check app/src/main/assets/data/encounters.js
          node --check app/src/main/assets/src/game.js
          node --check app/src/main/assets/platform.js
      - name: Test native Android build in pull requests (not released)
        if: github.event_name == 'pull_request'
        working-directory: echo-chroniken/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Decode private signing key into temporary runner directory
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ECHO_KEYSTORE_B64 }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/echochroniken-stable-signing.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ECHO_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request'
        working-directory: echo-chroniken/android
        env:
          ECHO_SIGNING_PASSWORD: ${{ secrets.ECHO_SIGNING_PASSWORD }}
          ECHO_SIGNING_ALIAS: ${{ secrets.ECHO_SIGNING_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package, APK signature, and direct download
        if: github.event_name != 'pull_request'
        run: |
          APK="echo-chroniken/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='de.echochroniken.game.stable'"
          cp "$APK" Echo-Chroniken-Universal.apk
          sha256sum Echo-Chroniken-Universal.apk
      - name: Publish only the directly installable APK, never a ZIP
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Echo-Chroniken - eine Android-App, stabile Updates
          body: |
            Lade `Echo-Chroniken-Universal.apk` direkt herunter und installiere sie.
            Diese Version wird unter **Echo-Chroniken** angezeigt, mit der dauerhaft unveränderten Paket-ID
            `de.echochroniken.game.stable` und dem privat hinterlegten festen Signaturschlüssel.
            Nachfolgende Versionen lassen sich über diese App installieren, ohne eine weitere App anzulegen.

            Alte experimentelle Apps (Dorf, Fair, Neu, Paket, Pfad) sind davon getrennt.
            Alte Spielstände werden nicht automatisch importiert. Bitte vor dem Löschen sichern.

            Build aus Commit: ${{ github.sha }}
          files: Echo-Chroniken-Universal.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true
