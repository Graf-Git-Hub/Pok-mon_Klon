name: Echo-Chroniken Elements, Runes and UI

on:
  pull_request:
    paths:
      - 'echo-chroniken/project/data/affinities.js'
      - 'echo-chroniken/project/data/skills.js'
      - 'echo-chroniken/project/data/species.js'
      - 'echo-chroniken/project/src/game.js'
      - 'echo-chroniken/project/index.html'
      - 'echo-chroniken/project/qa/type-combat-browser.py'
      - 'echo-chroniken/project/qa/rune-learning-browser.py'
      - 'echo-chroniken/project/tests/elemental-types-and-runes.cjs'
      - '.github/workflows/echo-dual-types.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-dual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  types-and-runic-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Chrome browser automation
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: 150 species, 12 elements, runic teaching and four prepared attacks
        run: node echo-chroniken/project/tests/elemental-types-and-runes.cjs
      - name: Regenerate verified complete species and moves catalog
        run: |
          node echo-chroniken/project/qa/generate-type-catalog.cjs
          git diff --exit-code echo-chroniken/docs/game-design/TYPE_AND_ATTACK_CATALOG.md
      - name: Browser renders and switches typed creatures on desktop and touch
        run: python echo-chroniken/project/qa/type-combat-browser.py
      - name: Actually earn runes from story fights (both control schemes)
        run: python echo-chroniken/project/qa/natural-opening.py --both --seeded
      - name: Spend actual earned runes, verify learning survives save/load
        run: python echo-chroniken/project/qa/rune-learning-browser.py
      - name: Archive screenshots, test reports and earned saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-dual-types-and-runes
          path: |
            echo-chroniken/docs/visual-audit/dual-type/
            echo-chroniken/docs/visual-audit/natural-opening/
          retention-days: 7
          if-no-files-found: warn
