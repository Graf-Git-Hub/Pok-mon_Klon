name: Echo-Chroniken Retro Start Menu and HP

on:
  pull_request:
    paths:
      - 'echo-chroniken/project/src/game.js'
      - 'echo-chroniken/project/data/skills.js'
      - 'echo-chroniken/project/tests/save-compat.cjs'
      - 'echo-chroniken/project/qa/retro-start-menu-browser.py'
      - '.github/workflows/echo-retro-start-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependency
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: Preserve save inventory combat and HP status
        run: |
          node echo-chroniken/project/tests/save-compat.cjs
          node echo-chroniken/project/tests/battle-potions.cjs
          node echo-chroniken/project/tests/battle-healing.cjs
          node echo-chroniken/project/tests/combat-status.cjs
          node echo-chroniken/project/tests/auto-equipment.cjs
          node echo-chroniken/project/tests/ep-divider.cjs
      - name: Real Chrome desktop and touch Start menu tests
        run: python echo-chroniken/project/qa/retro-start-menu-browser.py
      - name: Keep screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-retro-menu-qa
          path: echo-chroniken/docs/visual-audit/retro-start-menu/
          retention-days: 7
          if-no-files-found: warn
