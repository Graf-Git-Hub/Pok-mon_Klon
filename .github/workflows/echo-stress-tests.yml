name: Echo-Chroniken Stress Tests (Responsive & Combat)

on:
  pull_request:
    paths:
      - 'echo-chroniken/project/src/**'
      - 'echo-chroniken/project/styles/**'
      - 'echo-chroniken/project/tests/human-battle-stress.cjs'
      - 'echo-chroniken/project/qa/responsive-stress.py'
      - 'echo-chroniken/project/qa/gamepad-mapping-stress.py'
      - '.github/workflows/echo-stress-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echo-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          google-chrome --version
      - name: 4800 real-engine duels with human-like strategies
        run: node echo-chroniken/project/tests/human-battle-stress.cjs
      - name: 11 sizes, touch buttons, portrait-landscape rotation
        run: python echo-chroniken/project/qa/responsive-stress.py
      - name: Emulate Switch gamepad A/B/Plus and D-pad in actual browser
        run: python echo-chroniken/project/qa/gamepad-mapping-stress.py
      - name: Upload stress reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-stress-diagnostics
          path: echo-chroniken/docs/visual-audit/stress-testing/
          retention-days: 7
          if-no-files-found: warn
