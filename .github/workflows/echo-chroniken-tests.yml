name: Echo-Chroniken Tests
on:
  push:
    paths: ['echo-chroniken/**', '.github/workflows/echo-chroniken-tests.yml']
  pull_request:
    paths: ['echo-chroniken/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test quests, routes, rewards, scenes and controller navigation
        working-directory: echo-chroniken/project
        run: |
          for test in tests/*.cjs; do
            node "$test" || exit 1
          done
