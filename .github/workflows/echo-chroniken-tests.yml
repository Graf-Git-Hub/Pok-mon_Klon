name: Echo-Chroniken Tests
on:
  push:
    paths: ['echo-chroniken/**', '.github/workflows/echo-chroniken-tests.yml']
  pull_request:
    paths: ['echo-chroniken/**']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test quests, routes, rewards, scenes and controller navigation
        working-directory: echo-chroniken/project
        run: |
          node tests/map-registry.cjs
          node tests/save-compat.cjs
          node tests/story-registry.cjs
          node tests/back-art.cjs
          node tests/smoke.cjs
          node tests/house.cjs
          node tests/package.cjs
          node tests/village.cjs
          node tests/encounters.cjs
          node tests/first-route.cjs
          node tests/exploration.cjs
          node tests/interiors.cjs
          node tests/interiors-integration.cjs
          node tests/platformer.cjs
          node tests/platformer-integration.cjs
          node tests/ruins.cjs
          node tests/ruins-integration.cjs
