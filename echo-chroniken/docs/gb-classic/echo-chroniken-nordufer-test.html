const TILE=16,view=document.getElementById("view"),ctx=view.getContext("2d");
const sel=document.getElementById("scene");
const msg=document.getElementById("message"),hud=document.getElementById("hud");
const padStatus=document.getElementById("controller-state");
const names=Object.keys(DATA.scenes),glyph=DATA.symbols;
for(const name of names){const op=document.createElement("option");op.value=name;op.textContent=DATA.scenes[name].title;sel.appendChild(op);}
let scene="legacy_wurzeldorf",px=10,py=15,dir=[0,-1],wave=0,paused=false;
const WALK_MS=134, RUSTLE_MS=320;
const rustles=new Map();
function grassPose(x,y,now){
 const key=x+','+y, entry=rustles.get(key);
 if(!entry)return -1;
 const elapsed=now-entry.start;
 if(elapsed<0)return -1;
 if(elapsed>=RUSTLE_MS){rustles.delete(key);return -1;}
 return elapsed<120?entry.first:1-entry.first;
}
let motion=null,walkFoot=0,pendingDirection=null;
function actorPose(now=performance.now()){
 const direction=dir[0]<0?'left':dir[0]>0?'right':dir[1]<0?'up':'down';
 const elapsed=motion?Math.max(0,now-motion.start):WALK_MS;
 const t=Math.min(8,Math.floor(elapsed*8/WALK_MS))/8;
 return {direction,frame:t>0&&t<1?motion.frame:0,
         x:t<1?motion.x+(px-motion.x)*t:px,y:t<1?motion.y+(py-motion.y)*t:py};
}
let outsideDoor={x:10,y:15};
let gamepadLastMove=0,gamepadLastButtons={},lastFrame=0,gamepadConnected=false;
let lastCamera={x:0,y:0,w:10,h:9},lastLayout="";
// This is one fixed tiled world. Only the camera dimensions change.
function screenTiles(){return {w:10,h:9};}
function neighbors(map){
 return Object.entries(map.portals).filter(([,exit])=>exit.direction).map(([key,exit])=>{
  const [x,y]=key.split(',').map(Number),[dx,dy]=exit.direction;
  return {map:DATA.scenes[exit.scene],ox:x+dx-exit.x,oy:y+dy-exit.y,x,y,dx,dy};
 });
}
function cameraFor(map,pos=actorPose()){
 const {w,h}=screenTiles();
 let left=0,right=map.width,top=0,bottom=map.height;
 for(const n of neighbors(map)){
  if(n.dx && Math.abs(n.y-pos.y)<h/2+1){
   left=Math.min(left,n.ox);right=Math.max(right,n.ox+n.map.width);
  }
  if(n.dy && Math.abs(n.x-pos.x)<w/2+1){
   top=Math.min(top,n.oy);bottom=Math.max(bottom,n.oy+n.map.height);
  }
 }
 const origin=(min,max,span,focus)=>max-min<span?Math.floor((min+max-span)/2):
  Math.max(min,Math.min(max-span,focus-Math.floor(span/2)));
 return {x:origin(left,right,w,pos.x+0.5),y:origin(top,bottom,h,pos.y),w,h};
}
function setStatus(message){msg.textContent=message;}
function stage(name,returning=false,entry=null,crossing=null){
 if(!DATA.scenes[name])return;
 scene=name;sel.value=name;paused=false;motion=null;pendingDirection=null;rustles.clear();if(!crossing)stopHeld();
 const m=DATA.scenes[name],found=[];
 for(let y=0;y<m.height;y++)for(let x=0;x<m.width;x++)
  if(glyph[m.rows[y][x]]==="player")found.push([x,y]);
 [px,py]=m.entry?[m.entry.x,m.entry.y]:found[0]||[Math.floor(m.width/2),m.height-3];
 if(returning){
  px=outsideDoor.x;py=outsideDoor.y;
 }
 if(entry){
  px=Math.max(0,Math.min(m.width-1,entry.x));
  py=Math.max(0,Math.min(m.height-1,entry.y));
 }
 dir=crossing||[0,-1];
 if(crossing){
  walkFoot=1-walkFoot;
  motion={x:px-dir[0],y:py-dir[1],start:performance.now(),frame:walkFoot+1};
 }
 setStatus(m.title==="Wurzelheim"?"Zum Nordufer führt der Weg rechts aus dem Dorf.":"Am Nordufer führen beide Wege zum alten Steg.");
 draw();
}
function tileAt(map,x,y){
 return glyph[map.rows[y]?.[x]]||null;
}
const objectNames=["tree", "table", "counter", "bookshelf", "workbench", "forge", "plant", null, "anvil", "crate", "bed", "chair", "computer", "heal_pod", "capsule"], roomFloors=["Wohnhaus", "Laden", "Heilstation", "Teamtausch"];
function draw(now=performance.now()){
 if(typeof now!=='number')now=performance.now();
 const map=DATA.scenes[scene];
 if(!map||![atlas,actors,foreground,houses,edges,rustleSheet,biome].every(im=>im.complete&&im.naturalWidth))return;
 const pose=actorPose(now),cam=cameraFor(map,pose),layout=cam.w+"x"+cam.h;
 if(lastLayout!==layout){view.width=cam.w*TILE;view.height=cam.h*TILE;lastLayout=layout;}
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle=MANIFEST.palette[3];ctx.fillRect(0,0,view.width,view.height);
 const screenX=x=>Math.round(x*16)-Math.round(cam.x*16),screenY=y=>Math.round(y*16)-Math.round(cam.y*16);
 const depth=[],grass=[];
 function drawMap(map,ox,oy,current){
 const sx=x=>screenX(x+ox),sy=y=>screenY(y+oy);
 const localX=cam.x-ox,localY=cam.y-oy;
 const ground=map.indoor?'room_floor':'floor';
 const floorIndex=map.indoor?(scene.includes('house')?0:scene.includes('archive')||scene.includes('library')?1:scene.includes('research')?2:3):-1;
 function tile(id,x,y){
  let themed=-1;
  if(map.theme==='cave')themed=id==='rock'||id==='room_wall'?0:['floor','room_floor','path'].includes(id)?1:-1;
  if(map.theme==='ice')themed=id==='rock'||id==='room_wall'?2:['floor','room_floor','path'].includes(id)?3:-1;
  if(id==='roof_m'||id==='roof_l'||id==='roof_r')themed=4;
  if(id==='wall')themed=6;
  if(id==='window')themed=7;
  if(themed>=0){
   ctx.drawImage(biome,themed*16,0,16,16,sx(x),sy(y),16,16);
   return;
  }

  if(id==='room_floor'&&floorIndex>=0){
   ctx.drawImage(edges,(9+floorIndex)*TILE,0,TILE,TILE,sx(x),sy(y),TILE,TILE);
   return;
  }
  const i=MANIFEST.sprites[id]?.atlasIndex;
  if(i!==undefined)ctx.drawImage(atlas,i%8*16,Math.floor(i/8)*16,16,16,sx(x),sy(y),16,16);
 }
 const buildings=Object.entries(map.doorLinks||{}).map(([key,room])=>{
  const [x,y]=key.split(',').map(Number);
  return {left:x-2,top:y-2,kind:['Wohnhaus','Heilstation','Schmiede','Laden'].indexOf(room)};
 });
 buildings.push(...(map.buildings||[]));
 for(const {left,top,kind} of buildings){
  depth.push({y:(top+oy+3)*16,draw:()=>ctx.drawImage(houses,kind*80,0,80,48,sx(left),sy(top),80,48)});
 }
 for(let y=Math.max(0,Math.floor(localY));y<Math.min(map.height,Math.ceil(localY+cam.h)+1);y++){
  for(let x=Math.max(0,Math.floor(localX));x<Math.min(map.width,Math.ceil(localX+cam.w));x++){
   let id=tileAt(map,x,y);
   if((id==='room_wall'&&(x===0||y===0||x===map.width-1||y===map.height-1)&&!['cave','ice'].includes(map.theme))||(id==='door'&&ground==='room_floor')){
    const left=x===0,right=x===map.width-1;
    const edge=id==='door'?8:y===0?(left?4:right?5:0):
      y===map.height-1?(left?6:right?7:1):left?2:3;
    ctx.drawImage(edges,edge*TILE,0,TILE,TILE,sx(x),sy(y),TILE,TILE);
    continue;
   }
   const object=objectNames.indexOf(id);
   if(buildings.some(({left,top})=>x>=left&&x<left+5&&y>=top&&y<top+3)){
    tile(ground,x,y);
    continue;
   }
   if(id==='grass'){
    const frame=current?grassPose(x,y,now):-1;
    if(frame<0)tile(id,x,y);
    else ctx.drawImage(rustleSheet,frame*TILE,0,TILE,TILE,sx(x),sy(y),TILE,TILE);
    grass.push([x+ox,y+oy,frame]);
    continue;
   }
   if(id==='player'||id==='npc'||object>=0)tile(id==='player'&&false?'path':ground,x,y);
   else {
    if(id==='water_a'&&wave%2)id='water_b';
    tile(id,x,y);
    if(id==='fence'){
     // One modular post with neighbour-aware rails: no rails dangling into gates.
     tile(ground,x,y);
     const X=sx(x),Y=sy(y),rect=(a,b,w,h,c)=>{ctx.fillStyle=MANIFEST.palette[c];ctx.fillRect(X+a,Y+b,w,h);};
     for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
      if(tileAt(map,x+dx,y+dy)!=='fence')continue;
      if(dx){rect(dx<0?0:8,6,8,3,3);rect(dx<0?0:8,7,8,1,1);rect(dx<0?0:8,11,8,2,2);}
      else {rect(6,dy<0?0:8,3,8,3);rect(7,dy<0?0:8,1,8,1);}
     }
     rect(6,5,4,10,3);rect(7,4,2,1,3);rect(7,6,2,8,1);rect(7,6,1,7,0);
    }
    // Connected shoreline without new logical tiles; corners meet exactly.
    if(id==='water_a'||id==='water_b'){
     ctx.fillStyle=MANIFEST.palette[2];
     for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      if(!['water_a','water_b','water_edge'].includes(tileAt(map,x+dx,y+dy)))
       ctx.fillRect(sx(x)+(dx===1?15:0),sy(y)+(dy===1?15:0),dx?1:16,dy?1:16);
     }
    }
   }
   if(object>=0)depth.push({y:(y+oy)*16+16,draw:()=>{
    const h=id==='tree'?24:16,offset=id==='tree'?8:4;
    ctx.drawImage(foreground,object*16,0,16,h,sx(x),sy(y)-offset,16,h);
   }});
   if(id==='npc')depth.push({y:(y+oy)*16+16,draw:()=>{
    const kind=map.indoor?1:0;
    ctx.drawImage(actors,kind*16,64,16,16,sx(x),sy(y),16,16);
   }});
  }
 }
 }
 drawMap(map,0,0,true);
 for(const n of neighbors(map)){
  if(n.ox<cam.x+cam.w && n.oy<cam.y+cam.h && n.ox+n.map.width>cam.x && n.oy+n.map.height>cam.y)
   drawMap(n.map,n.ox,n.oy,false);
 }
 const sx=screenX,sy=screenY;
 depth.push({y:pose.y*16+16,draw:()=>{
  const row=['down','up','left','right'].indexOf(pose.direction);
  ctx.drawImage(actors,pose.frame*16,row*16,16,16,sx(pose.x),sy(pose.y),16,16);
 }});
 depth.sort((a,b)=>a.y-b.y).forEach(item=>item.draw());
 for(const [x,y,frame] of grass){
  const sheet=frame<0?foreground:rustleSheet;
  const sourceX=frame<0?112:32+frame*TILE;
  ctx.drawImage(sheet,sourceX,0,TILE,TILE,sx(x),sy(y),TILE,TILE);
 }
 if(hud.textContent!==map.title)hud.textContent=map.title;
 lastCamera=cam;
}
function canWalk(m,x,y){
 return x>=0&&y>=0&&x<m.width&&y<m.height&&m.solids[y][x]==='0';
}
function step(dx,dy){
 if(paused)return;
 if(motion && performance.now()-motion.start<WALK_MS){pendingDirection=[dx,dy];return;}
 dir=[dx,dy];
 const m=DATA.scenes[scene],x=px+dx,y=py+dy;
 if(x<0||y<0||x>=m.width||y>=m.height){
  const exit=m.portals[px+','+py];
  if(exit?.direction?.[0]===dx && exit.direction[1]===dy){
   stage(exit.scene,false,{x:exit.x,y:exit.y},[dx,dy]);
  }
  return;
 }
 if(!canWalk(m,x,y)){draw();return;}
 const id=tileAt(m,x,y),portal=m.portals[x+','+y];
 if(portal&&!portal.direction){stage(portal.scene,false,{x:portal.x,y:portal.y});return;}
 const from=actorPose();
 const start=performance.now();
 walkFoot=1-walkFoot;motion={x:from.x,y:from.y,start,frame:walkFoot+1};
 if(id==='grass')rustles.set(x+','+y,{start:start+WALK_MS*0.45,first:dx<0?0:dx>0?1:walkFoot});
 px=x;py=y;draw();
}
function action(){
 if(paused){pauseToggle();return;}
 const m=DATA.scenes[scene];
 const x=px+dir[0],y=py+dir[1],portal=m.portals[x+','+y];
 if(portal){step(...dir);return;}
 const marker=m.markers.find(p=>Math.abs(p.x-px)+Math.abs(p.y-py)<=1);
 setStatus(marker?m.title+" · "+(marker.label||'Hier liegt eine Spur der Geschichte.'):
  m.title+" · Mit A oder Enter kannst du Schilder lesen.");
}
function pauseToggle(){stopHeld();motion=null;pendingDirection=null;paused=!paused;setStatus(paused?"Pause. Start/Enter zum Fortsetzen.":"Weiter geht's.");draw();}
function fullscreenToggle(){
 if(document.fullscreenElement){
  if(document.exitFullscreen)document.exitFullscreen();
 }else if(document.documentElement.requestFullscreen){
  document.documentElement.requestFullscreen().catch(()=>setStatus("Dieser Browser bietet hier keinen Vollbildmodus."));
 }else setStatus("Vollbild ist in diesem Browser nicht verfügbar.");
}
const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
 w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
window.addEventListener("keydown",e=>{
 const d=keys[e.key];
 if(d){
  e.preventDefault();
  if(e.repeat)return;
  stopHeld();step(...d);heldKey=e.key;heldTimer=setInterval(()=>step(...d),140);
 }else if(["Enter"," ","z"].includes(e.key)){
  e.preventDefault();if(!e.repeat)action();
 }else if(["Escape","p"].includes(e.key)){
  e.preventDefault();if(!e.repeat)pauseToggle();
 }else if(e.key==="f"&&!e.repeat)fullscreenToggle();
});
let heldTimer=null,heldKey=null;
window.addEventListener("keyup",e=>{if(e.key===heldKey)stopHeld();});
function stopHeld(){heldKey=null;if(heldTimer!==null){clearInterval(heldTimer);heldTimer=null;}}
for(const el of document.querySelectorAll("button[data-move]")){
 const d=el.dataset.move.split(",").map(Number);
 el.addEventListener("pointerdown",e=>{
  if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
  e.preventDefault();stopHeld();step(...d);
  heldTimer=setInterval(()=>step(...d),140);
 });
 ["pointerup","pointercancel","lostpointercapture","pointerleave"].forEach(name=>
  el.addEventListener(name,stopHeld));
 // Keyboard activation already moves via the global keyboard listener.
}
window.addEventListener("blur",()=>{stopHeld();pendingDirection=null;});
document.getElementById("action").addEventListener("click",action);
document.getElementById("fullscreen").addEventListener("click",fullscreenToggle);
document.getElementById("reset").addEventListener("click",()=>stage(scene));
sel.addEventListener("change",()=>stage(sel.value));
window.addEventListener("resize",draw);
window.addEventListener("orientationchange",draw);
function readGamepad(now){
 const pads=typeof navigator.getGamepads==="function"?Array.from(navigator.getGamepads()||[]):[];
 const pad=pads.find(p=>p&&p.connected!==false);
 const connected=!!pad;
 if(connected!==gamepadConnected){
  gamepadConnected=connected;
  document.body.classList.toggle("gamepad",connected);
  padStatus.textContent=connected?"🎮 Controller verbunden · Steuerkreuz/Stick, A: Aktion, B: Zurück, Start: Pause":
   "Handy: Touch · TV: Controller (Steuerkreuz / Stick, A, B, Start) · PC: Pfeiltasten/WASD";
  draw();
 }
 if(!pad)return;
 const pressed=i=>!!pad.buttons?.[i]?.pressed;
 let dx=0,dy=0;
 if(pressed(14))dx=-1;else if(pressed(15))dx=1;
 if(pressed(12))dy=-1;else if(pressed(13))dy=1;
 const axes=pad.axes||[];
 if(!dx&&Math.abs(axes[0]||0)>.5)dx=Math.sign(axes[0]);
 if(!dy&&Math.abs(axes[1]||0)>.5)dy=Math.sign(axes[1]);
 if(dx&&dy){
  if(Math.abs(axes[0]||0)>=Math.abs(axes[1]||0))dy=0;
  else dx=0;
 }
 if((dx||dy)&&now-gamepadLastMove>=140){
  step(dx,dy);gamepadLastMove=now;
 }
 for(const [i,callback] of [[0,action],[1,()=>{
    if(false)stage("legacy_wurzeldorf");
    else setStatus("Mit dem Steuerkreuz kannst du weiterlaufen.");
   }],[9,pauseToggle]]){
  const current=pressed(i),was=!!gamepadLastButtons[i];
  if(current&&!was)callback();
  gamepadLastButtons[i]=current;
 }
}
function animate(now){
 if(!paused && pendingDirection && (!motion||now-motion.start>=WALK_MS)){
  const next=pendingDirection;pendingDirection=null;step(...next);
 }
 if(!paused && now-lastFrame>=380){wave++;lastFrame=now;}
 draw(now);
 readGamepad(now);
 requestAnimationFrame(animate);
}
Promise.all([atlas,actors,foreground,houses,edges,rustleSheet,biome].map(im=>im.decode())).then(()=>{stage("legacy_wurzeldorf");requestAnimationFrame(animate);});
</script></body></html>
