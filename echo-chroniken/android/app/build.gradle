plugins { id 'com.android.application' }

// This application ID is permanent. Never change it for ordinary updates.
// Android requires one and the same PRIVATE signing key for every upgrade.
def echoSigningPath = System.getenv('ECHO_KEYSTORE_PATH')
def echoSigningPassword = System.getenv('ECHO_SIGNING_PASSWORD')
def echoSigningAlias = System.getenv('ECHO_SIGNING_ALIAS') ?: 'echochroniken'
android {
    namespace 'de.echochroniken.game'
    compileSdk 35

    defaultConfig {
        applicationId 'de.echochroniken.game.stable'
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName '0.18.0'
    }
    signingConfigs {
        stable {
            storeFile file(echoSigningPath ?: 'missing-private-signing-keystore.p12')
            storePassword echoSigningPassword ?: ''
            keyAlias echoSigningAlias
            keyPassword echoSigningPassword ?: ''
            storeType 'pkcs12'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            signingConfig signingConfigs.stable
            debuggable false
            minifyEnabled false
        }
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.16.0' }
